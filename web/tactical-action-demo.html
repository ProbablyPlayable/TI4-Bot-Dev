<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Tactical action · Interactive concept</title>
  <style>
    :root {
      --canvas: #0b1017;
      --surface: #121a25;
      --raised: #192331;
      --line: #283446;
      --text: #eef2f6;
      --muted: #9aaac0;
      --faint: #73849a;
      --gold: #edbd7b;
      --cyan: #8cd5ef;
      --green: #8dd2b0;
      --red: #f3a098;
      --orange: #d69a75;
      --accent: var(--gold);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-columns: minmax(0, 1fr);
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button,
    select,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    button,
    select {
      color: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible,
    summary:focus-visible,
    .system:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    svg {
      display: block;
    }

    h2,
    h3,
    p {
      margin: 0;
    }

    .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      display: inline-block;
      vertical-align: middle;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .mono {
      font-variant-numeric: tabular-nums;
    }

    .bad {
      color: var(--red);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--raised);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 650;
      min-height: 36px;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .button:hover:not(:disabled) {
      background: #233247;
      border-color: #4b5c72;
    }

    .button--primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #171d27;
    }

    .button--primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent), white 15%);
      border-color: color-mix(in srgb, var(--accent), white 15%);
    }

    .button--quiet {
      background: transparent;
    }

    .button--small {
      min-height: 28px;
      padding: 3px 9px;
      font-size: 12px;
    }

    .button--icon {
      width: 32px;
      min-height: 32px;
      padding: 0;
    }

    .button--demo {
      background: transparent;
      border-style: dashed;
      color: var(--muted);
    }

    .button:disabled {
      opacity: .42;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge--draft {
      color: var(--gold);
      background: #edbd7b12;
      border: 1px solid #edbd7b32;
    }

    .badge--live {
      color: var(--cyan);
      background: #8cd5ef12;
      border: 1px solid #8cd5ef32;
    }

    .badge--done {
      color: var(--green);
      background: #8dd2b012;
      border: 1px solid #8dd2b032;
    }

    .badge--alert {
      color: var(--red);
      background: #f3a09812;
      border: 1px solid #f3a09832;
    }

    .badge--quiet {
      color: var(--muted);
      border: 1px solid var(--line);
    }

    select {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      max-width: 100%;
    }

    /* Two header rows: toolbar and stepper. Everything below is content. */
    .app {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 48px;
      padding: 6px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .tb-status {
      display: flex;
      flex-direction: column;
      min-width: 0;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
    }

    .tb-status strong {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin: 0 6px 2px 0;
    }

    .workspace-switch {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: #080d14;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .workspace-switch button {
      border: 1px solid transparent;
      background: none;
      padding: 4px 14px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .workspace-switch button[aria-pressed="true"] {
      color: var(--accent);
      background: var(--raised);
      border-color: var(--line);
    }

    .workspace-switch button:disabled {
      opacity: .4;
    }

    .tb-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-right: auto;
      font-size: 14px;
      white-space: nowrap;
    }

    .tb-title strong {
      font-weight: 650;
    }

    .tb-title span.muted {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tb-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu {
      position: relative;
    }

    .menu summary {
      list-style: none;
    }

    .menu summary::-webkit-details-marker {
      display: none;
    }

    .menu-items {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      z-index: 10;
      display: grid;
      min-width: 170px;
      padding: 5px;
      background: var(--raised);
      border: 1px solid #415065;
      border-radius: 8px;
      box-shadow: 0 12px 30px #0006;
    }

    .menu-items button {
      padding: 8px 10px;
      border: 0;
      border-radius: 5px;
      background: none;
      text-align: left;
      font-size: 13px;
    }

    .menu-items button:hover {
      background: #2a3a50;
    }

    .stepper {
      display: flex;
      align-items: stretch;
      gap: 8px;
      min-height: 40px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .step-tabs {
      display: flex;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .step-tab {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 1 1 0;
      min-width: 0;
      padding: 0 10px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: none;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }

    .step-tab:hover:not(:disabled) {
      background: #ffffff05;
    }

    .step-tab[aria-selected="true"] {
      background: #8cd5ef0a;
      border-bottom-color: var(--cyan);
    }

    .step-tab:disabled {
      color: var(--faint);
    }

    .step-chip {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid #46546a;
      color: var(--muted);
      font-size: 12px;
    }

    .step-chip .icon {
      width: 12px;
      height: 12px;
    }

    .step-tab[data-state="done"] .step-chip,
    .step-tab[data-state="skipped"] .step-chip {
      color: var(--green);
      background: #8dd2b009;
      border-color: #8dd2b032;
    }

    .step-tab[aria-current="step"] .step-chip {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--canvas);
      font-weight: 700;
    }

    .step-tab[data-state="needs-review"] .step-chip {
      background: var(--red);
      border-color: var(--red);
      color: var(--canvas);
    }

    .step-name {
      font-weight: 650;
    }

    .step-caption {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 12px;
    }

    .step-tab[aria-current="step"] .step-caption {
      color: var(--accent);
    }

    .step-tab[data-state="needs-review"] .step-caption {
      color: var(--red);
    }

    .stepper-side {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .action-body {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      flex: 1;
      min-height: 0;
    }

    .action-body.map-wide {
      grid-template-columns: minmax(330px, 44%) minmax(0, 1fr);
    }

    .context-pane {
      min-height: 0;
      overflow-y: auto;
      background: #0e151f;
      border-right: 1px solid var(--line);
      padding: 12px 14px 16px;
    }

    .context-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--faint);
    }

    .galaxy {
      position: relative;
      margin: 4px -6px 0;
    }

    .galaxy svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 56vh;
    }

    .galaxy [role="button"] {
      cursor: pointer;
      outline: none;
    }

    .galaxy .system.linked .hex {
      stroke: var(--accent);
      stroke-width: 2.4;
    }

    .galaxy .planet.linked circle,
    .galaxy .planet:focus-visible circle {
      stroke: var(--text);
      stroke-opacity: 1;
      stroke-width: 2.4;
    }

    .galaxy .planet.exhausted circle {
      fill-opacity: .35;
      stroke-dasharray: 2 2;
    }

    .route,
    .wormhole-arc {
      fill: none;
      pointer-events: none;
    }

    .route {
      stroke: var(--cyan);
      stroke-width: 1.6;
      stroke-dasharray: 5 4;
      opacity: .75;
    }

    .route.idle {
      opacity: 0;
    }

    .route.linked {
      opacity: 1;
      stroke-width: 3;
    }

    .wormhole-arc {
      stroke: #e6c15c;
      stroke-width: 1;
      stroke-dasharray: 1 5;
      opacity: .55;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      margin-top: 4px;
      color: var(--faint);
      font-size: 12px;
    }

    .map-legend i {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 5px;
      border-radius: 50%;
    }

    .unit-row.linked,
    .payment-choice.linked,
    .origin-line.linked,
    .sub-heading.linked {
      background: #8cd5ef0f;
    }

    .origin-line {
      display: flex;
      align-items: baseline;
      gap: 4px 10px;
      flex-wrap: wrap;
      width: 100%;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: none;
      text-align: left;
      font-size: 13px;
      color: var(--muted);
    }

    .origin-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .origin-open {
      margin-left: auto;
      color: var(--accent);
    }

    .sub-heading {
      padding: 7px 14px 4px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .sub-heading strong {
      color: var(--text);
      font-weight: 600;
    }

    .sub-heading.section {
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .stay {
      padding: 7px 14px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
    }

    .route-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .route-select {
      max-width: 100%;
      padding: 2px 6px;
      background: var(--canvas);
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--text);
      font: inherit;
    }

    .mod,
    .where {
      color: var(--accent);
    }

    .payment-choice .where {
      color: var(--muted);
      font-weight: 400;
    }

    .galaxy .system:hover>.hex,
    .galaxy .system:focus-visible>.hex {
      stroke: var(--cyan);
      stroke-width: 2;
    }

    .map-tools {
      position: absolute;
      right: 6px;
      bottom: 2px;
      display: flex;
      gap: 3px;
    }

    .map-tools button {
      width: 28px;
      height: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 14px;
    }

    .system-context {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .system-context h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .context-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 7px;
      margin-top: 7px;
    }

    .context-row .planned {
      color: var(--accent);
    }

    .owner {
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--muted);
    }

    .owner-dot {
      display: inline-block;
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      background: var(--faint);
      border-radius: 50%;
    }

    .owner-dot--sol {
      background: var(--cyan);
    }

    .owner-dot--hacan {
      background: var(--orange);
    }

    .economy {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .economy div {
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .economy strong {
      display: block;
      font-size: 16px;
      font-weight: 500;
    }

    .economy span {
      font-size: 12px;
      color: var(--muted);
    }

    .task-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .task-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line);
    }

    .task-head h2 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -.2px;
    }

    .task-head .button {
      margin-left: auto;
    }

    .task-lede {
      flex-basis: 100%;
      color: var(--muted);
      font-size: 13px;
    }

    .trail {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
    }

    .trail span {
      color: var(--faint);
      font-size: 12px;
      padding: 1px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .trail span.complete {
      color: var(--green);
      border-color: #8dd2b026;
    }

    .trail span.active {
      color: var(--accent);
      background: #edbd7b08;
      border-color: #edbd7b32;
    }

    .trail span.skipped {
      border-style: dashed;
    }

    .task-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 20px 20px;
    }

    .task-content>*+* {
      margin-top: 12px;
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
    }

    .footer-note.error {
      color: var(--red);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff02;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }

    .card-heading h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .card-heading span {
      font-size: 12px;
      color: var(--muted);
    }

    .card-body {
      padding: 12px 14px;
    }

    .card-body>*+* {
      margin-top: 10px;
    }

    .section-title {
      color: var(--muted);
      margin-top: 18px;
    }

    .unit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 14px;
    }

    .unit-row+.unit-row {
      border-top: 1px solid #28344680;
    }

    .unit-label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
    }

    .unit-label .icon {
      color: #b6c6d7;
      width: 22px;
      height: 22px;
    }

    .unit-label strong {
      font-weight: 550;
    }

    .unit-label small {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .unit-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .unit-quantity {
      font-weight: 550;
    }

    .unit-row.invalid {
      background: #f3a09807;
    }

    .unit-row.invalid strong,
    .unit-row.invalid small {
      color: var(--red);
    }

    .counter {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--canvas);
    }

    .counter button {
      width: 32px;
      height: 32px;
      padding: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
    }

    .counter button:hover:not(:disabled) {
      background: var(--raised);
      color: var(--text);
    }

    .counter button:disabled {
      opacity: .3;
    }

    .counter output {
      min-width: 28px;
      text-align: center;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }

    .segmented button {
      padding: 5px 9px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 12px;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--raised);
      color: var(--accent);
    }

    .gauges {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px 16px;
    }

    .gauge-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .gauge-label strong {
      color: var(--text);
      font-weight: 550;
    }

    .gauge-track {
      height: 4px;
      background: var(--line);
      border-radius: 5px;
      margin-top: 5px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 5px;
    }

    .gauge-fill.invalid {
      background: var(--red);
    }

    .inline-note {
      padding: 8px 12px;
      border-left: 2px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: #edbd7b06;
      color: var(--muted);
      font-size: 13px;
    }

    .inline-note strong {
      color: var(--text);
      font-weight: 550;
    }

    .inline-note.error {
      border-color: var(--red);
      background: #f3a09807;
      color: var(--red);
    }

    .inline-note.success {
      border-color: var(--green);
      background: #8dd2b006;
    }

    .inline-note.quiet {
      border-color: var(--line);
      background: none;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .summary-stat {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .summary-stat .eyebrow {
      color: var(--faint);
    }

    .summary-stat strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
      font-weight: 500;
    }

    .summary-stat p {
      color: var(--muted);
      font-size: 12px;
    }

    .outcome-card {
      padding: 12px 14px;
      border-color: #8dd2b036;
      background: #8dd2b006;
    }

    .outcome-card h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .outcome-card>p {
      color: var(--muted);
      font-size: 12px;
    }

    .outcome-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 16px;
      margin-top: 10px;
      border-top: 1px solid #8dd2b026;
      padding-top: 10px;
      font-size: 13px;
    }

    .outcome-facts .eyebrow {
      display: block;
      color: var(--faint);
    }

    /* One table for every dice step: space cannon, barrage, combat rounds, bombardment, ground combat. */
    .record-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .record-tabs button {
      padding: 3px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .record-tabs button[aria-pressed="true"] {
      background: var(--raised);
      border-color: #4b5c72;
      color: var(--text);
    }

    .battle {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .battle-score {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 14px;
      padding: 6px 12px;
      background: #ffffff04;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .battle-score .owed {
      margin-left: auto;
      color: var(--accent);
      font-weight: 650;
    }

    .battle-sides {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
    }

    .battle-side {
      display: grid;
      grid-template-columns: minmax(118px, 1.3fr) 30px 34px minmax(64px, 2fr) 46px auto;
      column-gap: 6px;
      align-content: start;
      min-width: 0;
      padding: 9px 12px 10px;
    }

    .battle-side>* {
      grid-column: 1 / -1;
    }

    .battle-side+.battle-side {
      box-shadow: -1px -1px 0 var(--line);
    }

    .side-head {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: 14px;
    }

    .side-head .eyebrow {
      color: var(--cyan);
    }

    .battle-side[data-seat="hacan"] .side-head .eyebrow {
      color: var(--orange);
    }

    .side-head .side-hits {
      margin-left: auto;
      font-weight: 650;
    }

    .side-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 12px;
      margin: 2px 0 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .b-row {
      display: grid;
      grid-template-columns: subgrid;
      align-items: center;
      row-gap: 6px;
      min-height: 34px;
      padding: 3px 0;
      border-top: 1px solid #28344680;
      font-size: 13px;
    }

    .b-row.lost {
      color: var(--faint);
    }

    .b-unit {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-weight: 550;
    }

    .b-unit .icon {
      width: 18px;
      height: 18px;
      color: #b6c6d7;
    }

    .b-target {
      color: var(--muted);
    }

    .b-target.modified {
      color: var(--accent);
    }

    .b-dice {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .die {
      width: 24px;
      height: 24px;
      border: 1px solid var(--line);
      background: var(--canvas);
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .die.hit {
      border-color: #8dd2b060;
      color: var(--green);
      background: #8dd2b012;
      font-weight: 700;
    }

    .die.empty {
      border-style: dashed;
      background: none;
    }

    .b-hits {
      text-align: right;
      color: var(--muted);
      white-space: nowrap;
    }

    .b-hits.scored {
      color: var(--green);
      font-weight: 650;
    }

    .b-change {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .pill {
      padding: 0 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .pill.loss {
      color: var(--red);
      border-color: #f3a09840;
      background: #f3a0980d;
    }

    .pill.damage {
      color: var(--gold);
      border-color: #edbd7b40;
    }

    .pill.staged {
      border-style: dashed;
    }

    .b-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 0 4px 25px;
    }

    .odds {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
    }

    .odds-head,
    .odds-sub {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2px 12px;
      color: var(--muted);
    }

    .odds-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
      font-size: 16px;
    }

    .odds-bar {
      display: flex;
      flex: 1;
      height: 8px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--line);
    }

    .odds-bar i:nth-child(1) {
      background: var(--cyan);
    }

    .odds-bar i:nth-child(2) {
      background: var(--faint);
    }

    .odds-bar i:nth-child(3) {
      background: var(--orange);
    }

    .offer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 10px 14px;
      border: 1px solid #edbd7b40;
      border-radius: 8px;
      background: #edbd7b08;
    }

    .offer .eyebrow {
      color: var(--gold);
    }

    .offer h3 {
      font-size: 15px;
      font-weight: 600;
    }

    .offer p {
      color: var(--muted);
      font-size: 13px;
    }

    .offer-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .planet-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .planet-facts strong {
      color: var(--text);
      font-weight: 550;
    }

    .planet-result {
      color: var(--green);
      font-size: 13px;
      font-weight: 600;
    }

    .planet-result.failed {
      color: var(--red);
    }

    .payment-choice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .payment-choice+.payment-choice {
      border-top: 1px solid var(--line);
    }

    .payment-choice input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .payment-choice strong {
      font-weight: 550;
    }

    .payment-choice span {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    /* Demo controls live at the bottom so they spend no product chrome. */
    .demo-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 6px 16px;
      background: #080c12;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 12px;
    }

    .demo-tag {
      padding: 1px 6px;
      border: 1px dashed var(--faint);
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .demo-tip {
      flex: 1 1 260px;
      min-width: 0;
      color: var(--muted);
    }

    dialog {
      width: min(470px, calc(100vw - 32px));
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid #415065;
      border-radius: 12px;
      box-shadow: 0 30px 100px #0007;
    }

    dialog::backdrop {
      background: #02050ac9;
      backdrop-filter: blur(3px);
    }

    .dialog-content {
      padding: 22px;
    }

    .dialog-content h2 {
      font-size: 20px;
      margin-top: 10px;
    }

    .dialog-content p {
      font-size: 13px;
      color: var(--muted);
      margin: 6px 0 14px;
    }

    .dialog-content ul {
      padding: 0;
      list-style: none;
      margin: 14px 0;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .dialog-content li {
      padding: 9px 12px;
      font-size: 13px;
    }

    .dialog-content li+li {
      border-top: 1px solid var(--line);
    }

    .dialog-footer {
      padding: 14px 22px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translate(-50%, 12px);
      padding: 10px 16px;
      background: #223346;
      border: 1px solid #4c6885;
      border-radius: 7px;
      font-size: 13px;
      max-width: calc(100vw - 32px);
      width: max-content;
      box-shadow: 0 10px 30px #0005;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 20;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1180px) {
      .action-body {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .action-body.map-wide {
        grid-template-columns: minmax(280px, 44%) minmax(0, 1fr);
      }

      .tb-status span {
        display: none;
      }
    }

    @media (max-width: 860px) {
      body {
        display: block;
        height: auto;
        overflow: auto;
      }

      .toolbar {
        flex-wrap: wrap;
        gap: 6px 10px;
      }

      .tb-title {
        order: 3;
        flex-basis: 100%;
      }

      .tb-controls {
        margin-left: auto;
      }

      .stepper {
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 0 8px;
      }

      .step-tab {
        flex: 0 0 auto;
      }

      .action-body {
        display: flex;
        flex-direction: column;
      }

      .context-pane {
        order: 2;
        border-right: 0;
        border-top: 1px solid var(--line);
      }

      .galaxy {
        max-width: 360px;
        margin-inline: auto;
      }

      .map-wide .context-pane {
        order: 0;
        border-top: 0;
        border-bottom: 1px solid var(--line);
      }

      .map-wide .economy,
      .map-wide .system-context {
        display: none;
      }

      .task-content {
        overflow: visible;
      }

      .task-head,
      .task-content,
      .task-footer {
        padding-inline: 14px;
      }

      .task-footer {
        position: sticky;
        bottom: 0;
        flex-wrap: wrap;
      }

      .footer-actions {
        margin-left: auto;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .battle-sides {
        grid-template-columns: minmax(0, 1fr);
      }

      .battle-side {
        grid-template-columns: minmax(112px, 1.3fr) 24px 28px minmax(52px, 2fr) 40px auto;
        column-gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    const STEPS = ['Activation', 'Movement', 'Space combat', 'Invasion', 'Production'];

    function renderTask(state) {
      const step = state.selected, status = stepState(state, step), editing = state.edit?.step === step, draft = state.mode === 'draft';
      const pill = status === 'skipped' ? ['quiet', 'Skipped'] : status === 'boundary' ? ['draft', 'Preview ends here'] : status === 'needs-review' ? ['alert', 'Needs review'] : status === 'done' ? (editing ? ['draft', 'Editing'] : ['done', draft ? 'Drafted' : 'Resolved']) : draft ? ['draft', 'Preparing'] : mine(state) ? ['live', `Your decision · ${need(state).what}`] : ['quiet', `Waiting for ${waitingFor(state)} · ${need(state).what}`];
      const canEdit = draft && KEYS[step] && status === 'done' && !editing;
      const edit = canEdit ? `<button class="button button--quiet button--small" data-action="edit-step" data-step="${step}" ${state.edit?.dirty ? `disabled title="Commit or reset the ${STEPS[state.edit.step].toLowerCase()} changes first"` : ''}>${icon('edit')}Edit ${step === 3 ? 'landings' : STEPS[step].toLowerCase()}</button>` : '';
      const lede = stepLede(state, step);
      const body = [activationContent, movementContent, combatContent, invasionContent, productionContent][step](state);
      return `<section class="task-panel" id="step-panel" role="tabpanel" aria-labelledby="step-tab-${step}" tabindex="-1">
          <div class="task-head"><h2>${STEPS[step]}</h2><span class="badge badge--${pill[0]}">${pill[1]}</span>${stepTrail(state, step)}${edit}${lede ? `<p class="task-lede">${lede}</p>` : ''}</div>
          <div class="task-content">${body}</div>${taskFooter(state)}</section>`;
    }
    function taskFooter(state) {
      const step = state.selected, draft = state.mode === 'draft', battle = activeBattle(state);
      const foot = (note, actions = '', error = false) => `<footer class="task-footer"><span class="footer-note ${error ? 'error' : ''}" id="footer-note" ${error ? 'role="status"' : ''}>${note}</span><div class="footer-actions">${actions}</div></footer>`;
      const button = (action, label, kind = 'quiet', off = false) => `<button class="button button--${kind}" data-action="${action}" ${off ? 'disabled' : ''} aria-describedby="footer-note">${label}</button>`;
      const apply = button('open-apply', `Apply to Live ${icon('arrow')}`, 'primary', viewer !== 'sol' || !!state.edit);
      if (state.edit?.step === step) {
        const error = validation(state), current = step === state.frontier;
        const verb = (draft ? ['Preview activation', 'Preview movement', '', 'Preview landings', 'Preview production'] : ['Activate system', 'Move fleet', '', 'Commit ground forces', 'Produce units'])[step];
        return foot(error || (draft ? 'Private to you until you apply.' : 'This commits to the live game.'), `${state.edit.dirty || !current ? button('cancel-edit', current ? 'Reset selection' : 'Cancel edits') : ''}${button('commit-edit', `${verb} ${icon('arrow')}`, 'primary', !!error)}`, !!error);
      }
      if (state.frontier !== null && step !== state.frontier) return foot(`Viewing ${STEPS[step].toLowerCase()}. The action is at ${STEPS[state.frontier].toLowerCase()}.`, button('return-current', `${draft ? 'Go to' : 'Continue to'} ${STEPS[state.frontier].toLowerCase()} ${icon('arrow')}`, draft ? 'quiet' : 'primary'));
      if (state.frontier === null) return foot(draft ? 'Every step is drafted. Review, edit, or apply.' : 'Action complete. Every step keeps its result.', draft ? apply : '');
      if (state.blocker === 'boundary') return foot('Later steps unlock after this live result.', apply);
      if (!mine(state)) return foot(`Waiting for ${waitingFor(state)} · ${need(state).what}.`, button('simulate', `Simulate ${waitingFor(state)} (demo)`, 'demo'));
      if (battle?.stage === 'pre') {
        const side = SIDES.find((name) => controls(state, name));
        const retreat = battle.kind === 'space' && !battle.announced.att && !battle.announced.def ? button('battle-announce', 'Announce retreat') : '';
        return foot(`Round ${battle.round} · Both sides roll at once.${side && battle.boost[side] ? ' Morale Boost applies.' : ''}`, `${retreat}${button('battle-roll', `Roll combat dice ${icon('arrow')}`, 'primary')}`);
      }
      if (battle?.stage === 'assign') {
        const owed = battle.owed[battle.side];
        return foot(`${battle.staged.length} of ${plural(owed, 'hit')} assigned. Choose on your rows.`, `${battle.staged.length ? button('reset-hits', 'Reset selection') : ''}${button('battle-assign', `Assign ${plural(owed, 'hit')}`, 'primary', battle.staged.length < owed)}`);
      }
      if (battle?.stage === 'reaction') return foot('Reaction window. Passing keeps the card.', `${button('reaction-pass', 'Pass')}${button('reaction-play', 'Play Direct Hit', 'primary')}`);
      if (battle?.stage === 'retreat') return foot('Your surviving ships leave the active system.', button('battle-retreat', battle.pick ? `Retreat to ${battle.pick}` : 'Choose a destination', 'primary', !battle.pick));
      return foot('');
    }

    // ---- Rendering and events -------------------------------------------------------------------
    const signature = (element) => element?.dataset?.action ? JSON.stringify({ ...element.dataset }) : element?.id ? '#' + element.id : null;
    function render() {
      const state = currentState();
      normalize(state);
      const focused = signature(document.activeElement), inside = document.getElementById('app').contains(document.activeElement);
      const scroll = { step: document.getElementById('step-panel')?.dataset.step, task: document.querySelector('.task-content')?.scrollTop, context: document.querySelector('.context-pane')?.scrollTop, tabs: document.querySelector('.step-tabs')?.scrollLeft };
      document.documentElement.style.setProperty('--accent', state.mode === 'draft' ? 'var(--gold)' : state.frontier === null ? 'var(--green)' : 'var(--cyan)');
      document.getElementById('example').value = state.example;
      document.getElementById('viewer').value = viewer;
      document.getElementById('tip').textContent = state.tip;
      document.getElementById('app').innerHTML = `${renderHeader(state)}<div class="action-body ${mapStep(state) === null ? '' : 'map-wide'}">${renderMap(state)}${renderTask(state)}</div>`;
      document.getElementById('step-panel').dataset.step = state.selected;
      document.querySelector('.context-pane').scrollTop = scroll.context || 0;
      document.querySelector('.step-tabs').scrollLeft = scroll.tabs || 0;
      if (scroll.step === String(state.selected)) document.querySelector('.task-content').scrollTop = scroll.task || 0;
      document.getElementById(`step-tab-${state.selected}`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (state.reveal) document.querySelector(`.task-content [data-link~="${state.reveal}"]`)?.scrollIntoView({ block: 'nearest' });
      state.reveal = null;
      if (!inside) return;
      const target = [...document.querySelectorAll('#app [data-action], #app [id]')].find((element) => signature(element) === focused);
      (target && !target.disabled ? target : document.getElementById('step-panel')).focus({ preventScroll: true });
    }
    function announce(message) { document.getElementById('announcer').textContent = message; }
    function toast(message) {
      const element = document.getElementById('toast');
      element.textContent = message;
      element.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove('visible'), 3500);
    }
    function selectStep(step) {
      const state = currentState();
      if (step === null || !isReached(state, step)) return;
      state.selected = step;
      render();
      document.getElementById(`step-tab-${step}`).focus({ preventScroll: true });
      announce(`Viewing ${STEPS[step]}. ${state.frontier === null ? 'Action complete.' : `Current step: ${STEPS[state.frontier]}.`}`);
    }
    function commitEdit() {
      const state = currentState();
      if (!state.edit || validation(state)) return;
      const step = state.edit.step;
      if (step === 0 && state.edit.value.system !== state.data.activation.system) state.data.invasion = {};
      state.data[KEYS[step]] = clone(state.edit.value);
      state.edit = null;
      commitStep(state, step);
      // Keep a fresh dice result on screen; otherwise follow the action.
      const results = state.mode === 'live' && (step === 3 && (Object.keys(state.inv.records).length || Object.keys(state.inv.battles).length) || step === 1 && state.cannon);
      state.selected = results ? step : state.frontier ?? step;
      state.inspect = state.data.activation.system;
      remember(state);
      render();
      toast(state.mode === 'draft' ? `${STEPS[step]} drafted. Later steps rechecked.` : `${STEPS[step]} committed.`);
      announce(state.frontier === null ? 'All steps complete.' : `Current step: ${STEPS[state.frontier]}.`);
    }
    function openApply() {
      const state = currentState();
      if (state.mode !== 'draft' || !canApply(state) || state.edit) return;
      const items = [`Activate ${systemName(state)} · #${state.data.activation.system}`, `Move ${list(state.fleet)}`];
      if (state.ground.infantry + state.ground.mech) items.push(`Transport ${list(force(state.ground))}`);
      if (state.done[3]) items.push(...state.planets.filter((planet) => size(landed(state, planet.id))).map((planet) => `Land ${list(landed(state, planet.id))} on ${planet.name}`));
      if (state.done[4]) items.push(`Produce ${plural(productionTotals(state, state.data.production).count, 'unit')} for ${plural(productionTotals(state, state.data.production).cost, 'resource')}`);
      const dialog = document.getElementById('apply-dialog');
      dialog.innerHTML = `<div class="dialog-content"><span class="badge badge--draft">Private draft</span><h2 id="apply-title">Apply to Live?</h2><p id="apply-description">These recorded choices are committed to the live game in order.</p><ul>${items.map((item) => `<li>${item}</li>`).join('')}</ul><div class="inline-note"><strong>Costs 1 tactic token.</strong> ${state.frontier === null ? 'The whole action is prepared.' : 'Dice and later decisions continue in Live.'}</div></div><div class="dialog-footer"><button class="button button--quiet" data-action="close-apply" autofocus>Cancel</button><button class="button button--primary" data-action="confirm-apply">Apply to Live ${icon('arrow')}</button></div>`;
      dialog.showModal();
    }
    function confirmApply() {
      const draft = workspaces.draft;
      const live = blankState('applied', 'live', draft.route, draft.data);
      Object.assign(live, { stale: draft.stale, tip: 'Your draft is now the live action. Recorded steps are read-only; the rest needs live decisions.' });
      // Replay the recorded choices until the live game needs something the draft could not hold.
      for (const step of [0, 1, 3, 4]) if (draft.done[step] && live.frontier === step && live.blocker === 'decision') commitStep(live, step);
      live.selected = live.frontier ?? 4;
      remember(live);
      workspaces.live = live;
      workspaces.draft = makeState('draft-start');
      document.getElementById('apply-dialog').close();
      mode = 'live';
      render();
      toast('Draft applied. Continue in Live.');
    }
    function simulate(state) {
      const battle = activeBattle(state);
      if (battle?.stage === 'pre') battleRoll(state, battle);
      else if (battle?.stage === 'waiting') { battle.stage = 'hits'; battleContinue(state, battle); }
      else if (!battle && state.blocker === 'decision') { state.edit = null; commitStep(state, state.frontier); }
    }
    const battleActions = {
      'battle-roll': (state, battle) => battleRoll(state, battle),
      'battle-announce': (state, battle) => { battle.announced[SIDES.find((side) => controls(state, side))] = true; },
      'play-card': (state, battle, control) => {
        const side = SIDES.find((name) => controls(state, name));
        battle.boost[side] = true;
        state.hands[SEAT[side]] = state.hands[SEAT[side]].filter((card) => card !== control.dataset.card);
      },
      'stage-hit': (state, battle, control) => { if (battle.staged.length < battle.owed[battle.side]) battle.staged.push({ type: control.dataset.type, kind: control.dataset.kind }); },
      'reset-hits': (state, battle) => { battle.staged = []; },
      'battle-assign': (state, battle) => {
        applyActions(battle.forces[battle.side], battle.staged, battle.records.at(-1), battle.side);
        Object.assign(battle, { staged: [], stage: 'hits' });
        battle.owed[battle.side] = 0;
        battleContinue(state, battle);
      },
      'reaction-pass': (state, battle) => { Object.assign(battle, { reaction: null, stage: 'hits' }); battleContinue(state, battle); },
      'reaction-play': (state, battle) => {
        const { side, target, type } = battle.reaction, rec = battle.records.at(-1), unit = battle.forces[target][type];
        unit.n--; unit.dmg--; rec.dmg[target][type]--;
        rec.lost[target][type] = (rec.lost[target][type] || 0) + 1;
        rec.notes.push(`${P[SEAT[side]].name} played Direct Hit. The ${U[type].name} that sustained damage was destroyed.`);
        state.hands[SEAT[side]] = state.hands[SEAT[side]].filter((card) => card !== 'Direct Hit');
        Object.assign(battle, { reaction: null, stage: 'hits' });
        battleContinue(state, battle);
      },
      'pick-retreat': (state, battle, control) => { battle.pick = control.dataset.value; },
      'battle-retreat': (state, battle) => { battle.destination = battle.pick; endRound(state, battle); },
    };
    function loadExample(example) {
      const state = makeState(example);
      clearTimeout(toastTimer);
      document.getElementById('toast').classList.remove('visible');
      mode = state.mode;
      workspaces[mode] = state;
      if (mode === 'draft') viewer = 'sol';
    }
    document.addEventListener('click', (event) => {
      const menu = document.querySelector('.menu[open]');
      if (menu && !menu.contains(event.target)) menu.open = false;
      const control = event.target.closest('[data-action]');
      if (!control || control.disabled || control.type === 'checkbox' || control.tagName === 'SELECT') return;
      const state = currentState();
      const action = control.dataset.action;
      if (action === 'select-step') return selectStep(Number(control.dataset.step));
      if (action === 'return-current') return selectStep(state.frontier);
      if (action === 'return-edit') return selectStep(state.edit.step);
      if (action === 'commit-edit') return commitEdit();
      if (action === 'open-apply') return openApply();
      if (action === 'close-apply') return document.getElementById('apply-dialog').close();
      if (action === 'confirm-apply') return confirmApply();
      if (battleActions[action]) {
        const battle = activeBattle(state);
        if (!battle) return;
        const frontier = state.frontier;
        state.view = {};
        battleActions[action](state, battle, control);
        if (battle.stage === 'done') toast(battle.kind === 'space' ? 'Space combat resolved. Its record stays in this step.' : 'Ground combat resolved.');
        else if (action === 'battle-announce') toast('Retreat announced. Your ships leave after this round.');
        if (state.frontier !== frontier) announce(state.frontier === null ? 'Action complete.' : `Current step: ${STEPS[state.frontier]}.`);
      } else if (action === 'workspace') mode = control.dataset.mode;
      else if (action === 'simulate') { state.view = {}; simulate(state); }
      else if (action === 'undo' || action === 'redo') travel(state, state.cursor + (action === 'undo' ? -1 : 1));
      else if (action === 'start-over') { workspaces.draft = makeState('draft-start'); toast('Draft cleared. Choose a system to begin.'); }
      else if (action === 'discard') { workspaces.draft = makeState('draft-start'); mode = 'live'; toast('Draft discarded.'); }
      else if (action === 'edit-step') {
        const step = Number(control.dataset.step);
        if (state.mode !== 'draft' || state.edit?.dirty || !isReached(state, step) || !KEYS[step]) return;
        beginEdit(state, step);
        announce(`Editing ${STEPS[step]}. Changes are uncommitted.`);
      } else if (action === 'cancel-edit') {
        state.edit = null;
        toast('Changes dropped. The recorded choices are unchanged.');
      } else if (action === 'count' || action === 'remove-line' || action === 'place') {
        if (!state.edit) return;
        const path = action === 'place' ? `place.${control.dataset.type}` : control.dataset.path;
        const value = action === 'place' ? control.dataset.value : action === 'remove-line' ? Math.max(0, available(state, state.edit.value, path)) : Math.max(0, Math.min(Number(control.dataset.delta) > 0 ? Number(control.dataset.max) : Infinity, (dig(state.edit.value, path) || 0) + Number(control.dataset.delta)));
        put(state.edit.value, path, value);
        state.edit.dirty = true;
        announce(validation(state) || 'Selection updated.');
      } else if (action === 'choose-system' || action === 'inspect-system') {
        state.inspect = control.dataset.system;
        if (state.edit?.step === 0 && TARGETS.includes(state.inspect)) Object.assign(state.edit, { value: { system: state.inspect }, dirty: true });
        if (state.edit?.step === 1 && ORIGIN_IDS.includes(state.inspect)) { state.open[state.inspect] = true; state.reveal = `sys:${state.inspect}`; }
      } else if (action === 'toggle-origin') {
        state.open[control.dataset.system] = true;
        state.inspect = control.dataset.system;
      } else if (action === 'map-pay') {
        if (state.edit?.step !== 4) return;
        state.edit.value.pay[control.dataset.id] = !state.edit.value.pay[control.dataset.id];
        state.edit.dirty = true;
        state.reveal = `pl:${control.dataset.id}`;
        announce(validation(state) || 'Payment staged.');
      } else if (action === 'record-tab') state.view[control.dataset.id] = control.dataset.key;
      else if (action === 'zoom' || action === 'center-map') state.zoom = action === 'center-map' ? 1 : Math.max(.7, Math.min(1.3, state.zoom + Number(control.dataset.delta)));
      render();
    });
    document.addEventListener('change', (event) => {
      const state = currentState();
      const action = event.target.dataset.action;
      if (action === 'route' && state.edit?.step === 1) state.edit.value['@' + event.target.dataset.line] = Number(event.target.value);
      else if (action === 'payment' && state.edit?.step === 4) put(state.edit.value, event.target.dataset.path, event.target.checked);
      else return;
      state.edit.dirty = true;
      render();
      announce(validation(state) || (action === 'route' ? 'Route changed.' : 'Payment staged.'));
    });
    document.addEventListener('keydown', (event) => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const state = currentState();
        const reached = STEPS.map((_, step) => step).filter((step) => isReached(state, step));
        const index = reached.indexOf(state.selected);
        selectStep(event.key === 'Home' ? reached[0] : event.key === 'End' ? reached.at(-1) : reached[(index + (event.key === 'ArrowRight' ? 1 : -1) + reached.length) % reached.length]);
      }
      const mapSystem = event.target.closest('.galaxy [role="button"]');
      if (mapSystem && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); mapSystem.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    });
    // A list row and its system, planet, or route on the map light up together.
    function link(event, on) {
      const source = event.target.closest?.('[data-link]');
      document.querySelectorAll('.linked').forEach((element) => element.classList.remove('linked'));
      if (on && source) for (const token of source.dataset.link.split(' ')) document.querySelectorAll(`[data-link~="${token}"]`).forEach((element) => element.classList.add('linked'));
    }
    for (const [name, on] of [['mouseover', true], ['focusin', true], ['mouseout', false], ['focusout', false]]) document.addEventListener(name, (event) => link(event, on));
    document.getElementById('example').addEventListener('change', (event) => {
      loadExample(event.target.value);
      render();
      announce(`Loaded ${event.target.selectedOptions[0].textContent}.`);
    });
    document.getElementById('viewer').addEventListener('change', (event) => {
      viewer = event.target.value;
      // A seat change restarts the live example, so nobody inherits a half-made decision.
      workspaces.live = makeState(examples[workspaces.live.example] ? workspaces.live.example : 'live-combat');
      if (viewer !== 'sol') mode = 'live';
      render();
    });
    document.getElementById('reset-example').addEventListener('click', () => {
      const example = currentState().example;
      loadExample(examples[example] ? example : 'live-combat');
      render();
      toast('This example has been reset.');
    });
    render();
  </script>
</body>

</html>
