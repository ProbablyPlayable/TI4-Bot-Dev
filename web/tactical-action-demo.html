<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Tactical action · Interactive concept</title>
  <style>
    :root {
      --canvas: #0b1017;
      --surface: #121a25;
      --raised: #192331;
      --line: #283446;
      --text: #eef2f6;
      --muted: #9aaac0;
      --faint: #73849a;
      --gold: #edbd7b;
      --cyan: #8cd5ef;
      --green: #8dd2b0;
      --red: #f3a098;
      --accent: var(--gold);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button,
    select,
    summary {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    button,
    select {
      color: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 4px;
    }

    svg {
      display: block;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display: inline-block;
      vertical-align: middle;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .mono {
      font-variant-numeric: tabular-nums;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--raised);
      padding: 10px 15px;
      font-size: 12px;
      font-weight: 650;
      min-height: 40px;
      transition: background .15s, border-color .15s;
    }

    .button:hover:not(:disabled) {
      background: #233247;
      border-color: #4b5c72;
    }

    .button--primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #171d27;
    }

    .button--primary:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent), white 15%);
      border-color: color-mix(in srgb, var(--accent), white 15%);
    }

    .button--quiet {
      background: transparent;
    }

    .button--small {
      min-height: 34px;
      padding: 6px 11px;
    }

    .button:disabled {
      opacity: .42;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .badge--draft {
      color: var(--gold);
      background: #edbd7b12;
      border: 1px solid #edbd7b32;
    }

    .badge--live {
      color: var(--cyan);
      background: #8cd5ef12;
      border: 1px solid #8cd5ef32;
    }

    .badge--summary {
      color: var(--green);
      background: #8dd2b012;
      border: 1px solid #8dd2b032;
    }

    .badge--editing {
      color: var(--gold);
      background: #edbd7b13;
      text-transform: none;
      letter-spacing: 0;
    }

    .prototype-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px max(24px, calc((100vw - 1360px) / 2));
      background: #080c12;
      border-bottom: 1px solid var(--line);
    }

    .prototype-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid #697d93;
      transform: rotate(45deg);
      border-radius: 6px;
    }

    .brand-mark .icon {
      transform: rotate(-45deg);
      width: 16px;
      height: 16px;
    }

    .prototype-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .prototype-tools label {
      color: var(--faint);
      font-size: 11px;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 28px 8px 10px;
      font-size: 12px;
      max-width: 100%;
    }

    .shell {
      max-width: 1360px;
      padding: 0 28px 24px;
      margin: auto;
    }

    .game-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 22px 0;
    }

    .game-status .eyebrow {
      color: var(--faint);
      margin-bottom: 5px;
    }

    .game-status strong {
      font-size: 14px;
      font-weight: 550;
    }

    .game-status .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      margin: 0 8px 2px 0;
    }

    .workspace-switch {
      display: flex;
      gap: 3px;
      padding: 4px;
      background: #080d14;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .workspace-switch button {
      border: 1px solid transparent;
      background: none;
      padding: 8px 17px;
      border-radius: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .workspace-switch button[aria-pressed="true"] {
      color: var(--accent);
      background: var(--raised);
      border-color: var(--line);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .seat-marker {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid #79bed25c;
      color: var(--cyan);
      background: #8cd5ef0d;
      border-radius: 50%;
    }

    .identity strong {
      font-size: 12px;
      display: block;
    }

    .identity span:not(.seat-marker) {
      color: var(--muted);
      font-size: 11px;
    }

    .action-frame {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 16px 60px #0002;
    }

    .action-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 23px 26px 21px;
      border-bottom: 1px solid var(--line);
    }

    .action-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -.6px;
    }

    .action-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .action-heading-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .apply-hint {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      max-width: 180px;
    }

    .timeline-scroll {
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(5, minmax(145px, 1fr));
      padding: 17px 21px 0;
      min-width: 785px;
      gap: 5px;
    }

    .step-tab {
      position: relative;
      display: flex;
      flex-direction: column;
      text-align: left;
      padding: 11px 12px 15px;
      border: 1px solid transparent;
      border-bottom: 3px solid transparent;
      border-radius: 7px 7px 0 0;
      background: none;
      min-height: 92px;
    }

    .step-tab:hover:not(:disabled) {
      background: #ffffff04;
    }

    .step-tab[aria-selected="true"] {
      background: #8cd5ef08;
      border-color: #8cd5ef17;
      border-bottom-color: var(--cyan);
    }

    .step-tab:disabled {
      color: var(--faint);
    }

    .step-top {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .step-number {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 1px solid #46546a;
      color: var(--muted);
      font-size: 11px;
    }

    .step-number .icon {
      width: 13px;
      height: 13px;
    }

    .step-tab[data-state="done"] .step-number,
    .step-tab[data-state="skipped"] .step-number {
      color: var(--green);
      background: #8dd2b009;
      border-color: #8dd2b032;
    }

    .step-tab[aria-current="step"] .step-number {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--canvas);
    }

    .step-tab[data-state="needs-review"] .step-number {
      background: var(--red);
      border-color: var(--red);
      color: var(--canvas);
    }

    .step-name {
      font-size: 12px;
      font-weight: 650;
    }

    .step-state {
      margin: 8px 0 0 33px;
      color: var(--muted);
      font-size: 10px;
    }

    .step-tab[aria-current="step"] .step-state {
      color: var(--accent);
    }

    .step-tab[data-state="needs-review"] .step-state {
      color: var(--red);
    }

    .step-tab:disabled .step-state {
      color: var(--faint);
    }

    .current-tag {
      margin-left: auto;
      color: var(--accent);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .timeline-legend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 33px;
      color: var(--faint);
      font-size: 10px;
      border-top: 1px solid var(--line);
    }

    .legend-items {
      display: flex;
      gap: 17px;
    }

    .legend-items span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-current {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .legend-viewing {
      width: 12px;
      height: 3px;
      background: var(--cyan);
    }

    .position-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 26px;
      background: #edbd7b07;
      border-top: 1px solid #edbd7b19;
      border-bottom: 1px solid var(--line);
    }

    .position-bar[data-kind="needs-review"] {
      background: #f3a09809;
      border-top-color: #f3a09826;
    }

    .position-bar[data-kind="waiting"],
    .position-bar[data-kind="complete"] {
      background: #8cd5ef05;
      border-top-color: #8cd5ef19;
    }

    .position-copy {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .position-icon {
      margin-top: 2px;
      color: var(--accent);
    }

    .position-bar[data-kind="needs-review"] .position-icon {
      color: var(--red);
    }

    .position-title {
      font-size: 12px;
      font-weight: 650;
    }

    .position-description {
      font-size: 11px;
      margin-top: 3px;
      color: var(--muted);
    }

    .position-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .action-body {
      display: grid;
      grid-template-columns: 350px minmax(0, 1fr);
      min-height: 530px;
    }

    .context-pane {
      background: #0e151f;
      border-right: 1px solid var(--line);
      padding: 21px;
    }

    .context-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--faint);
    }

    .context-label .small {
      font-size: 10px;
    }

    .galaxy {
      margin: 16px -9px 0;
      position: relative;
    }

    .galaxy svg {
      width: 100%;
      height: auto;
    }

    .galaxy .system {
      cursor: pointer;
      outline: none;
    }

    .galaxy .system:hover .hex,
    .galaxy .system:focus-visible .hex {
      stroke: var(--cyan);
      stroke-width: 2;
    }

    .map-tools {
      position: absolute;
      right: 9px;
      bottom: 4px;
      display: flex;
      gap: 3px;
    }

    .map-tools button {
      width: 29px;
      height: 29px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 14px;
    }

    .system-context {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 14px;
    }

    .system-context h3 {
      font-size: 13px;
      margin: 0 0 3px;
      font-weight: 600;
    }

    .system-context .small {
      font-size: 11px;
    }

    .planet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      margin-top: 10px;
      font-size: 11px;
    }

    .owner {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
    }

    .owner-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--cyan);
      border-radius: 50%;
    }

    .owner-dot--enemy {
      background: #d69a75;
    }

    .context-note {
      font-size: 10px;
      color: var(--faint);
      margin: 12px 2px 0;
    }

    .economy {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 19px;
    }

    .economy div {
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .economy strong {
      display: block;
      font-size: 17px;
      font-weight: 500;
    }

    .economy span {
      font-size: 9px;
      color: var(--muted);
    }

    .task-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .task-content {
      padding: 23px 27px 28px;
      flex: 1;
    }

    .viewing-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
      font-size: 10px;
      color: var(--cyan);
    }

    .task-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    h2 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -.4px;
      font-weight: 550;
      line-height: 1.3;
    }

    .task-description {
      color: var(--muted);
      font-size: 12px;
      margin: 7px 0 20px;
      max-width: 560px;
    }

    .substep-trail {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin: 16px 0 22px;
    }

    .substep-trail span {
      color: var(--faint);
      font-size: 10px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .substep-trail span.complete {
      color: var(--green);
      border-color: #8dd2b026;
    }

    .substep-trail span.active {
      color: var(--accent);
      background: #edbd7b08;
      border-color: #edbd7b32;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff02;
      overflow: hidden;
    }

    .card+.card {
      margin-top: 13px;
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line);
    }

    .card-heading h3 {
      font-size: 12px;
      font-weight: 600;
      margin: 0;
    }

    .card-heading span {
      font-size: 10px;
      color: var(--muted);
    }

    .card-body {
      padding: 15px;
    }

    .unit-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 15px;
    }

    .unit-row+.unit-row {
      border-top: 1px solid #28344680;
    }

    .unit-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .unit-label .icon {
      color: #b6c6d7;
      width: 24px;
      height: 24px;
    }

    .unit-label strong {
      font-weight: 550;
    }

    .unit-label small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 1px;
    }

    .unit-quantity {
      font-size: 13px;
      font-weight: 550;
    }

    .unit-row.invalid {
      background: #f3a09807;
      color: var(--red);
    }

    .unit-row.invalid small {
      color: var(--red);
    }

    .counter {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--canvas);
    }

    .counter button {
      width: 33px;
      height: 33px;
      padding: 0;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
    }

    .counter button:hover:not(:disabled) {
      background: var(--raised);
      color: var(--text);
    }

    .counter button:disabled {
      opacity: .3;
    }

    .counter output {
      min-width: 29px;
      text-align: center;
      font-size: 13px;
    }

    .gauges {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 17px;
    }

    .gauge-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 10px;
    }

    .gauge-label strong {
      color: var(--text);
      font-weight: 550;
    }

    .gauge-track {
      height: 4px;
      background: var(--line);
      border-radius: 5px;
      margin-top: 7px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 5px;
    }

    .gauge-fill.invalid {
      background: var(--red);
    }

    .inline-note {
      padding: 12px 14px;
      border-left: 2px solid var(--accent);
      border-radius: 0 5px 5px 0;
      background: #edbd7b06;
      color: var(--muted);
      font-size: 11px;
      margin-top: 17px;
    }

    .inline-note strong {
      color: var(--text);
      font-weight: 550;
    }

    .inline-note.error {
      border-color: var(--red);
      background: #f3a09807;
      color: var(--red);
    }

    .inline-note.success {
      border-color: var(--green);
      background: #8dd2b006;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .summary-stat {
      padding: 15px;
      background: #ffffff02;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .summary-stat .eyebrow {
      color: var(--faint);
      font-size: 9px;
    }

    .summary-stat strong {
      display: block;
      margin-top: 5px;
      font-size: 18px;
      font-weight: 500;
    }

    .summary-stat p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .boundary-card {
      background: linear-gradient(120deg, #edbd7b0a, #edbd7b02);
      border-color: #edbd7b35;
      padding: 20px;
      margin-bottom: 18px;
    }

    .boundary-card .eyebrow {
      color: var(--gold);
      margin-bottom: 9px;
    }

    .boundary-card h3 {
      margin: 0;
      font-size: 17px;
      font-weight: 550;
    }

    .boundary-card p {
      font-size: 12px;
      color: var(--muted);
      margin: 7px 0 0;
    }

    .versus {
      display: grid;
      grid-template-columns: 1fr 28px 1fr;
      align-items: stretch;
      gap: 10px;
      margin: 18px 0;
    }

    .versus>span {
      align-self: center;
      text-align: center;
      color: var(--faint);
      font-size: 10px;
    }

    .force-card {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      min-width: 0;
    }

    .force-card .eyebrow {
      color: var(--cyan);
      font-size: 9px;
    }

    .force-card.enemy .eyebrow {
      color: #d69a75;
    }

    .force-card h3 {
      font-size: 13px;
      margin: 6px 0 10px;
      font-weight: 600;
    }

    .force-card p {
      font-size: 11px;
      margin: 4px 0;
      color: var(--muted);
    }

    .outcome-card {
      padding: 19px;
      border-color: #8dd2b036;
      background: #8dd2b006;
      margin-bottom: 16px;
    }

    .outcome-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .outcome-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      background: #8dd2b013;
      color: var(--green);
      border-radius: 50%;
    }

    .outcome-card h3 {
      font-size: 18px;
      font-weight: 550;
      margin: 0;
    }

    .outcome-card p {
      color: var(--muted);
      font-size: 11px;
      margin: 2px 0 0;
    }

    .outcome-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
      margin-top: 18px;
      border-top: 1px solid #8dd2b026;
      padding-top: 15px;
    }

    .outcome-facts .eyebrow {
      color: var(--faint);
      font-size: 9px;
    }

    .outcome-facts p {
      font-size: 12px;
      color: var(--text);
      margin-top: 5px;
    }

    .rounds-heading {
      color: var(--muted);
      margin: 21px 0 9px;
    }

    .round-details {
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 7px;
    }

    .round-details summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 12px 14px;
      list-style: none;
      font-size: 11px;
    }

    .round-details summary::-webkit-details-marker {
      display: none;
    }

    .round-details summary::after {
      content: "+";
      color: var(--muted);
      font-size: 16px;
    }

    .round-details[open] summary::after {
      content: "−";
    }

    .round-details summary .muted {
      margin-left: auto;
    }

    .round-body {
      border-top: 1px solid var(--line);
      padding: 14px;
      font-size: 11px;
      color: var(--muted);
    }

    .dice-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .dice-owner {
      min-width: 62px;
      font-size: 10px;
    }

    .die {
      width: 27px;
      height: 27px;
      border: 1px solid var(--line);
      background: var(--canvas);
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .die.hit {
      border-color: #8dd2b049;
      color: var(--green);
      background: #8dd2b00b;
    }

    .round-body p {
      margin: 5px 0 0;
    }

    .planet-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .planet-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 15px;
    }

    .planet-card h3 {
      font-size: 14px;
      margin: 0 0 3px;
      font-weight: 600;
    }

    .planet-card p {
      font-size: 11px;
      color: var(--muted);
      margin: 5px 0 0;
    }

    .planet-card .counter {
      margin-top: 14px;
    }

    .planet-card .planet-result {
      color: var(--green);
      font-size: 10px;
      margin: 13px 0 3px;
    }

    .payment-choice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      font-size: 11px;
      cursor: pointer;
    }

    .payment-choice+.payment-choice {
      border-top: 1px solid var(--line);
    }

    .payment-choice input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      margin: 0;
    }

    .payment-choice strong {
      font-weight: 550;
    }

    .payment-choice span {
      margin-left: auto;
      color: var(--muted);
    }

    .task-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px 27px;
      border-top: 1px solid var(--line);
      background: #0e151a70;
    }

    .footer-note {
      color: var(--muted);
      font-size: 11px;
      max-width: 310px;
    }

    .footer-note.error {
      color: var(--red);
    }

    .footer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .scenario-note {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 2px 0;
      color: var(--faint);
      font-size: 11px;
    }

    .scenario-note strong {
      color: var(--muted);
      font-weight: 550;
    }

    .scenario-note .offline {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    dialog {
      width: min(470px, calc(100vw - 32px));
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid #415065;
      border-radius: 12px;
      box-shadow: 0 30px 100px #0007;
    }

    dialog::backdrop {
      background: #02050ac9;
      backdrop-filter: blur(3px);
    }

    .dialog-content {
      padding: 25px;
    }

    .dialog-content h2 {
      font-size: 21px;
      margin-top: 12px;
    }

    .dialog-content p {
      font-size: 12px;
      color: var(--muted);
      margin: 9px 0 18px;
    }

    .dialog-content ul {
      padding: 0;
      list-style: none;
      margin: 18px 0;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .dialog-content li {
      padding: 11px 13px;
      font-size: 12px;
    }

    .dialog-content li+li {
      border-top: 1px solid var(--line);
    }

    .dialog-footer {
      padding: 16px 25px;
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      border-top: 1px solid var(--line);
    }

    .toast {
      position: fixed;
      bottom: 23px;
      left: 50%;
      transform: translate(-50%, 12px);
      padding: 11px 17px;
      background: #223346;
      border: 1px solid #4c6885;
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      max-width: calc(100vw - 32px);
      width: max-content;
      box-shadow: 0 10px 30px #0005;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 20;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 1500px) {
      .shell {
        padding-top: 8px;
      }

      .action-body {
        min-height: 570px;
      }
    }

    @media (max-width: 1100px) {
      .action-body {
        grid-template-columns: 290px minmax(0, 1fr);
      }

      .context-pane {
        padding: 17px;
      }

      .task-content {
        padding: 22px;
      }

      .task-footer {
        padding: 16px 22px;
      }

      .identity {
        display: none;
      }

      .task-footer {
        flex-wrap: wrap;
      }

      .footer-actions {
        margin-left: auto;
      }
    }

    @media (max-width: 820px) {
      .shell {
        padding: 0 16px 20px;
      }

      .prototype-bar {
        padding: 12px 16px;
      }

      .prototype-brand .brand-mark {
        display: none;
      }

      .action-body {
        grid-template-columns: minmax(0, 1fr);
      }

      .context-pane {
        border-right: 0;
        border-top: 1px solid var(--line);
        order: 2;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
      }

      .context-label {
        grid-column: 1 / -1;
      }

      .galaxy {
        grid-column: 1;
        grid-row: 2 / 6;
        margin: 0;
      }

      .system-context {
        grid-column: 2;
      }

      .economy {
        grid-column: 2;
        margin-top: 12px;
      }

      .context-note {
        grid-column: 2;
      }

      .action-heading {
        padding: 20px;
      }

      .action-heading-controls {
        gap: 10px;
      }

      .apply-hint {
        display: none;
      }

      .position-bar {
        padding: 14px 20px;
      }

      .timeline-legend {
        padding: 10px 25px;
      }
    }

    @media (max-width: 540px) {
      .prototype-bar {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
      }

      .prototype-tools {
        width: 100%;
        gap: 8px;
      }

      .prototype-tools label {
        display: none;
      }

      .prototype-tools select {
        flex: 1;
        min-width: 0;
      }

      .game-bar {
        gap: 10px;
        padding: 16px 0;
      }

      .game-status strong {
        font-size: 11px;
      }

      .game-status .eyebrow {
        font-size: 8px;
      }

      .workspace-switch button {
        padding: 7px 10px;
        font-size: 11px;
      }

      .action-heading {
        align-items: flex-start;
        padding: 17px;
      }

      h1 {
        font-size: 20px;
      }

      .action-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 7px;
      }

      .action-heading p {
        max-width: 200px;
        font-size: 11px;
      }

      .action-heading-controls .button {
        padding: 8px 10px;
        font-size: 10px;
      }

      .action-heading-controls {
        padding-top: 3px;
      }

      .action-heading-controls .icon {
        display: none;
      }

      .timeline {
        padding: 12px 10px 0;
        min-width: 790px;
      }

      .timeline-legend {
        padding: 9px 17px;
      }

      .timeline-legend>span {
        display: none;
      }

      .position-bar {
        align-items: flex-start;
        flex-wrap: wrap;
        padding: 13px 17px;
        gap: 10px;
      }

      .position-actions {
        margin-left: 29px;
        flex-wrap: wrap;
      }

      .position-title {
        font-size: 11px;
      }

      .position-description {
        font-size: 10px;
      }

      .task-content {
        padding: 20px 17px;
      }

      h2 {
        font-size: 21px;
      }

      .task-title-row {
        flex-wrap: wrap;
      }

      .task-description {
        font-size: 11px;
      }

      .substep-trail {
        gap: 5px;
      }

      .versus {
        grid-template-columns: 1fr 19px 1fr;
        gap: 6px;
      }

      .force-card {
        padding: 12px;
      }

      .force-card p {
        font-size: 10px;
      }

      .task-footer {
        padding: 14px 17px;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .footer-note {
        max-width: none;
        font-size: 10px;
      }

      .footer-actions {
        width: 100%;
        margin: 0;
      }

      .footer-actions .button {
        flex: 1;
      }

      .planet-cards {
        gap: 9px;
      }

      .planet-card {
        padding: 12px;
      }

      .outcome-facts {
        gap: 12px;
      }

      .round-details summary {
        font-size: 10px;
        padding: 11px;
      }

      .context-pane {
        padding: 17px;
        gap: 0 12px;
      }

      .context-pane .system-context {
        padding: 10px;
      }

      .economy {
        gap: 4px;
      }

      .economy div {
        padding: 7px 5px;
      }

      .economy span {
        font-size: 8px;
      }

      .economy strong {
        font-size: 14px;
      }

      .scenario-note {
        flex-direction: column;
        gap: 8px;
        padding-top: 13px;
      }

      .scenario-note .offline {
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <header class="prototype-bar">
    <div class="prototype-brand">
      <span class="brand-mark" aria-hidden="true">◇</span>
      <span><strong style="color: var(--text)">TACTICAL ACTION</strong> <span class="muted">/ interactive
          concept</span></span>
    </div>
    <div class="prototype-tools">
      <label for="example">Load example</label>
      <select id="example" aria-label="Load demo example">
        <optgroup label="Private draft">
          <option value="draft-combat">Draft · Space combat boundary</option>
          <option value="draft-movement">Draft · Choose movement</option>
          <option value="draft-invasion">Draft · Choose landings</option>
          <option value="draft-production">Draft · Choose production</option>
          <option value="draft-review">Draft · Changed selection</option>
          <option value="draft-cannon">Draft · Space cannon boundary</option>
        </optgroup>
        <optgroup label="Real action">
          <option value="live-invasion">Live · Waiting in ground combat</option>
          <option value="summary">Summary · Completed action</option>
        </optgroup>
      </select>
      <button class="button button--quiet button--small" id="reset-example">Reset</button>
    </div>
  </header>
  <main class="shell" id="app"></main>
  <dialog id="apply-dialog" aria-labelledby="apply-title" aria-describedby="apply-description"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <noscript>
    <p style="padding: 24px">Enable JavaScript to explore this standalone click prototype.</p>
  </noscript>
  <script>
    // Standalone, fictional UI state. No imports, requests, storage, or game-engine integration.
    const icons = {
      check: '<path d="m5 12 4 4L19 6"/>',
      lock: '<rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
      arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
      back: '<path d="M19 12H5m5-5-5 5 5 5"/>',
      pause: '<path d="M9 5v14M15 5v14"/>',
      alert: '<path d="m12 3 10 17H2L12 3Z"/><path d="M12 9v4m0 3v.1"/>',
      clock: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
      edit: '<path d="m15 4 5 5-10 10-6 1 1-6L15 4Z"/><path d="m12 7 5 5"/>',
      minus: '<path d="M6 12h12"/>',
      flag: '<path d="M5 21V4m0 0c6-5 8 5 14 0v10c-6 5-8-5-14 0"/>',
      carrier: '<path d="M4 9h16v6H4zM7 6h10v3M7 15v3m5-3v3m5-3v3M2 12h2m16 0h2"/>',
      dreadnought: '<path d="m12 2 5 6 2 12H5L7 8l5-6Zm0 4v10M7 11h10"/>',
      cruiser: '<path d="m12 3 7 15-7-3-7 3L12 3Zm0 5v7"/>',
      destroyer: '<path d="m12 4 7 15-7-4-7 4L12 4ZM8 12h8"/>',
      fighter: '<path d="m12 4 2 7 7 6-9-3-9 3 7-6 2-7Zm0 10v6"/>',
      infantry: '<circle cx="12" cy="5" r="2"/><path d="M12 8v7m-5-4 5-2 5 2m-5 4-4 6m4-6 4 6"/>',
      planet: '<circle cx="12" cy="12" r="6"/><path d="M6 9c-6 1-5 7 6 5s13-8 6-6"/>',
      offline: '<rect x="4" y="5" width="16" height="12" rx="2"/><path d="M9 21h6m-3-4v4"/>',
    };
    const icon = (name) => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons.planet}</svg>`;
    const clone = (value) => JSON.parse(JSON.stringify(value));
    const stepNames = ['Activation', 'Movement', 'Space combat', 'Invasion', 'Production'];
    const unitNames = { carrier: 'Carrier', dreadnought: 'Dreadnought', cruiser: 'Cruiser', fighter: 'Fighters', infantry: 'Infantry', destroyer: 'Destroyer' };
    const baseData = {
      activation: { system: '27' },
      movement: { carrier: 1, dreadnought: 1, cruiser: 1, fighter: 2, infantry: 3 },
      invasion: { starpoint: 1, newalbion: 2 },
      production: { fighter: 2, infantry: 2, destroyer: 0, goods: true, jord: false },
    };
    const examples = {
      'draft-combat': { mode: 'draft', frontier: 2, blocker: 'boundary', route: 'hostile', tip: 'Select Movement, then Edit movement. The gold Current marker stays at Space combat while the blue underline follows your view.' },
      'draft-movement': { mode: 'draft', frontier: 1, blocker: 'decision', route: 'hostile', editor: 1, tip: 'Stage ships and cargo, then Preview movement. Future steps unlock only when the action reaches them.' },
      'draft-invasion': { mode: 'draft', frontier: 3, blocker: 'decision', route: 'ground', editor: 3, tip: 'Distribute infantry and preview the landings. The draft stops at ground combat; Production remains locked.' },
      'draft-production': { mode: 'draft', frontier: 4, blocker: 'decision', route: 'friendly', editor: 4, tip: 'Prepare a build and its payment, or revisit Movement. Reducing infantry demonstrates downstream landings needing review.' },
      'draft-review': { mode: 'draft', frontier: 1, blocker: 'needs-review', route: 'friendly', stale: true, tip: 'A recorded cruiser is no longer available. Review movement and remove it to regenerate the later preview.' },
      'draft-cannon': { mode: 'draft', frontier: 1, blocker: 'boundary', route: 'cannon', tip: 'Space cannon belongs to Movement. The current step is Movement, even though moving ships and loading cargo are already drafted.' },
      'live-invasion': { mode: 'live', frontier: 3, blocker: 'waiting', route: 'hostile', phase: 'ground', tip: 'Review the resolved space combat while ground combat waits. Simulate the response to continue through production.' },
      summary: { mode: 'summary', frontier: null, blocker: null, route: 'hostile', tip: 'Every step is available. Open combat rounds, review planet outcomes, and inspect the actual production payment.' },
    };
    let mode = 'draft';
    let toastTimer;
    let revision = 1;

    function makeState(example) {
      const configuration = examples[example];
      const state = {
        ...configuration, example, selected: configuration.frontier ?? 2, data: clone(baseData),
        edit: null, completed: configuration.frontier === null, skipped: {}, roundsOpen: [],
        inspect: '27', zoom: 1, revision: revision++,
      };
      if (configuration.route === 'ground' || configuration.route === 'friendly') state.skipped[2] = 'No opposing ships';
      if (example === 'draft-production') state.data.movement.cruiser = 0;
      if (configuration.editor !== undefined) beginEdit(state, configuration.editor);
      return state;
    }
    const workspaces = {
      draft: makeState('draft-combat'),
      live: makeState('live-invasion'),
      summary: makeState('summary'),
    };
    const currentState = () => workspaces[mode];
    const systemName = (state) => state.data.activation.system === '19' ? 'Wellon' : 'Starpoint / New Albion';
    const movementTotals = (movement) => ({
      ships: movement.carrier + movement.dreadnought + movement.cruiser,
      capacity: movement.carrier * 4 + movement.dreadnought,
      cargo: movement.fighter + movement.infantry,
    });
    const productionTotals = (production) => ({
      cost: Math.ceil(production.fighter / 2) + Math.ceil(production.infantry / 2) + production.destroyer,
      count: production.fighter + production.infantry + production.destroyer,
      paid: (production.goods ? 2 : 0) + (production.jord ? 4 : 0),
    });
    const editedData = (state, step) => state.edit?.step === step ? state.edit.value : state.data[['activation', 'movement', '', 'invasion', 'production'][step]];
    const infantryAvailable = (state) => state.data.movement.infantry;
    const fleetHeadroom = (state) => Math.max(0, 3 - (mode !== 'draft' && state.route === 'hostile' && (state.frontier === null || state.frontier > 2) ? 2 : movementTotals(state.data.movement).ships));
    function beginEdit(state, step) {
      const key = ['activation', 'movement', '', 'invasion', 'production'][step];
      state.edit = { step, value: clone(state.data[key]), dirty: false };
      state.selected = step;
    }
    function isReached(state, step) { return state.frontier === null || step <= state.frontier; }
    function stepState(state, step) {
      if (!isReached(state, step)) return 'future';
      if (state.skipped[step]) return 'skipped';
      if (state.frontier === step) return state.blocker || 'decision';
      return 'done';
    }
    function validation(state) {
      if (!state.edit) return '';
      const value = state.edit.value;
      if (state.edit.step === 1) {
        const totals = movementTotals(value);
        if (state.stale && value.cruiser) return 'The cruiser is no longer available. Remove it from the fleet.';
        if (totals.ships > 3) return 'Fleet supply exceeded. Stage no more than 3 non-fighter ships.';
        if (totals.cargo > totals.capacity) return `Cargo exceeds capacity by ${totals.cargo - totals.capacity}. Remove cargo or add a transport.`;
      }
      if (state.edit.step === 3) {
        const committed = value.starpoint + value.newalbion;
        if (committed > infantryAvailable(state)) return `Landings use ${committed} infantry; the fleet carries ${infantryAvailable(state)}. Adjust the landings.`;
      }
      if (state.edit.step === 4) {
        const totals = productionTotals(value);
        if (totals.count > 5) return 'Production capacity exceeded. Build no more than 5 units.';
        if (value.destroyer > fleetHeadroom(state)) return `Fleet supply allows ${fleetHeadroom(state)} additional non-fighter ships.`;
        if (totals.paid < totals.cost) return `Stage ${totals.cost - totals.paid} more resource${totals.cost - totals.paid === 1 ? '' : 's'} to pay for this build.`;
      }
      return '';
    }
    function position(state) {
      if (state.frontier === null) return { title: mode === 'draft' ? 'Draft complete · All five steps reviewed' : 'Action complete · All five steps resolved', description: mode === 'draft' ? 'Review any step, make changes, or apply the prepared action.' : 'Browse decisions and results from the full tactical action.', kind: 'complete', icon: 'check' };
      if (state.blocker === 'needs-review') return { title: `Current: ${stepNames[state.frontier]} · Needs review`, description: state.stale ? 'The recorded cruiser from Jord is no longer available.' : `The revised fleet carries ${infantryAvailable(state)} infantry; the retained landings need ${state.data.invasion.starpoint + state.data.invasion.newalbion}.`, kind: 'needs-review', icon: 'alert' };
      if (state.blocker === 'boundary') {
        const substep = state.route === 'cannon' ? 'Space cannon offense' : state.frontier === 3 ? 'Ground combat · New Albion' : 'Before the first combat roll';
        return { title: `Current: ${stepNames[state.frontier]} · Preview ends here`, description: `${substep}. A live outcome is needed to continue.`, kind: 'boundary', icon: 'pause' };
      }
      if (mode === 'live' && state.frontier === 3 && state.phase === 'ground') return { title: 'Current: Invasion · Waiting for Alex (Hacan)', description: 'New Albion · Assign 1 ground-combat hit. Earlier results remain available.', kind: 'waiting', icon: 'clock' };
      if (mode === 'live' && state.frontier === 2) return { title: 'Current: Space combat · Your decision', description: 'The fleet has arrived. Resolve the scripted demo battle to continue.', kind: 'decision', icon: 'flag' };
      const task = { 0: 'Choose a system to activate', 1: 'Stage ships and cargo', 3: 'Distribute ground forces', 4: 'Choose units and payment' }[state.frontier];
      return { title: `Current: ${stepNames[state.frontier]} · ${mode === 'draft' ? 'Preparing' : 'Your decision'}`, description: task || 'Review the current decision.', kind: 'decision', icon: 'edit' };
    }
    function applyReadiness(state) {
      if (state.edit) return `Commit or cancel ${stepNames[state.edit.step].toLowerCase()} edits first`;
      if (state.blocker === 'needs-review') return 'Resolve the changed selection first';
      if (state.frontier !== null && state.blocker !== 'boundary') return 'Complete the current draft decision first';
      return 'Your tactical action opportunity';
    }

          <div class="card"><div class="card-heading"><h3>Space dock · Starpoint</h3><span>Production capacity 5</span></div>${['fighter', 'infantry', 'destroyer'].map((key) => unitRow(key, production[key], key === 'destroyer' ? `1 resource each · ${fleetHeadroom(state)} fleet slot${fleetHeadroom(state) === 1 ? '' : 's'} free` : '1 resource per pair', editing ? counter(4, key, production[key], key === 'destroyer' ? Math.min(1, fleetHeadroom(state)) : 8, key === 'destroyer' ? 1 : 2) : '')).join('')}</div>
          <div class="gauges">${gauge('Production capacity', totals.count, 5)}<div class="summary-stat" style="padding: 9px 13px"><span class="eyebrow">${editing || mode === 'draft' ? 'Build cost' : 'Resources spent'}</span><strong style="font-size: 15px">${totals.cost} resources</strong></div></div>
          <div class="card" style="margin-top: 17px"><div class="card-heading"><h3>${editing ? 'Stage payment' : mode === 'draft' ? 'Planned payment' : 'Actual payment'}</h3><span>${totals.paid} value · ${Math.max(0, totals.paid - totals.cost)} overpayment</span></div>${editing ? `<label class="payment-choice"><input type="checkbox" data-action="payment" data-key="goods" data-focus-key="payment-goods" ${production.goods ? 'checked' : ''}/><strong>Spend 2 trade goods</strong><span>2 resources</span></label><label class="payment-choice"><input type="checkbox" data-action="payment" data-key="jord" data-focus-key="payment-jord" ${production.jord ? 'checked' : ''}/><strong>Exhaust Jord</strong><span>4 resources</span></label>` : `<div class="card-body small muted">${production.goods ? '2 trade goods' : ''}${production.goods && production.jord ? ' + ' : ''}${production.jord ? 'Jord exhausted · 4 resources' : ''}${!production.goods && !production.jord ? 'No payment required' : ''}</div>`}</div>
          ${error ? `<div class="inline-note error" role="status">${icon('alert')} ${error}</div>` : completed ? `<div class="inline-note success">${icon('check')} <strong>${mode === 'draft' ? 'Production drafted.' : 'Units produced.'}</strong> Fighters ${mode === 'draft' ? 'will be placed' : 'were placed'} in space; infantry on Starpoint.</div>` : ''}`;
    }
    function taskFooter(state) {
      const editing = state.edit?.step === state.selected;
      if (editing) {
        const error = validation(state);
        const labels = mode === 'draft' ? { 0: 'Preview activation', 1: 'Preview movement', 3: 'Preview landings', 4: 'Preview production' } : { 3: 'Commit ground forces', 4: 'Produce units' };
        return `<footer class="task-footer"><span class="footer-note ${error ? 'error' : ''}" id="edit-validation">${error || (mode === 'draft' ? 'Private changes · Later decisions are revalidated after you commit.' : 'Local demo only · This confirmation advances the scripted action.')}</span><div class="footer-actions"><button class="button button--quiet" data-action="cancel-edit">Cancel edits</button><button class="button button--primary" data-action="commit-edit" ${error ? 'disabled' : ''} aria-describedby="edit-validation">${labels[state.selected]} ${icon('arrow')}</button></div></footer>`;
      }
      if (state.frontier !== null && state.selected !== state.frontier) return `<footer class="task-footer"><span class="footer-note">Reviewing ${stepNames[state.selected].toLowerCase()} · The action remains at ${stepNames[state.frontier].toLowerCase()}.</span><button class="button button--quiet" data-action="return-current">Go to current step ${icon('arrow')}</button></footer>`;
      if (state.frontier === null) return `<footer class="task-footer"><span class="footer-note">${mode === 'draft' ? 'All choices are drafted. You can still review and edit each step.' : 'Complete action record · Results remain available as one timeline.'}</span>${mode === 'live' ? '<button class="button button--quiet" data-action="open-summary">Open action summary</button>' : '<span class="small muted">Select any step above</span>'}</footer>`;
      if (state.blocker === 'boundary') return `<footer class="task-footer"><span class="footer-note">Future steps unlock after this live outcome. The recorded prefix can still be applied.</span><button class="button button--primary" data-action="open-apply" ${state.edit ? 'disabled' : ''}>Apply to Live ${icon('arrow')}</button></footer>`;
      if (state.blocker === 'needs-review' || state.blocker === 'decision' && mode === 'draft') return `<footer class="task-footer"><span class="footer-note">${state.blocker === 'needs-review' ? 'Review the affected choices to regenerate the preview.' : 'Open the current controls to continue the action.'}</span><button class="button button--primary" data-action="edit-step" data-step="${state.frontier}" ${state.edit ? 'disabled' : ''}>${state.blocker === 'needs-review' ? 'Review ' : 'Prepare '}${stepNames[state.frontier].toLowerCase()} ${icon('arrow')}</button></footer>`;
      if (mode === 'live' && state.frontier === 2) return `<footer class="task-footer"><span class="footer-note">A fixed three-round battle demonstrates the live result view.</span><button class="button button--primary" data-action="advance-live">Resolve demo battle ${icon('arrow')}</button></footer>`;
      if (mode === 'live' && state.frontier === 3 && state.phase === 'ground') return `<footer class="task-footer"><span class="footer-note">Only Alex’s response advances the real action. Simulate it here.</span><button class="button button--primary" data-action="advance-live">Simulate Alex’s response ${icon('arrow')}</button></footer>`;
      return `<footer class="task-footer"><span class="footer-note">The current step needs your decision.</span><button class="button button--primary" data-action="edit-step" data-step="${state.frontier}">Resume decision ${icon('arrow')}</button></footer>`;
    }
    function renderTask(state) {
      const selected = state.selected;
      const editing = state.edit?.step === selected;
      const past = state.frontier === null || selected < state.frontier;
      const type = editing ? 'Editing choices' : state.edit && mode === 'draft' ? 'Before uncommitted edits' : mode === 'draft' ? 'Recorded draft' : past ? 'Resolved result' : 'Live resolution';
      const descriptions = [
        editing ? 'Choose the destination. Changing it reopens the dependent movement and later steps.' : 'The system and command-token cost that began this tactical action.',
        editing ? 'Stage ships and cargo together. Your recorded fleet stays intact until you commit these edits.' : `Fleet, transport, and space cannon · Destination: ${systemName(state)}.`,
        state.skipped[2] ? 'This rule step was reached and skipped. Its reason stays in the action record.' : past ? 'The actual battle outcome, losses, survivors, and rolls.' : 'The fleets are known. The combat result is not part of a draft.',
        editing ? 'Distribute the infantry carried by your fleet. Unassigned infantry stays in transport.' : past ? 'Landings, planet-by-planet combat, and resulting control.' : 'Landings and planet resolution remain in one invasion step.',
        editing ? 'Build a cart, stage payment, and preview the placements in one step.' : 'Units, payment, and placement from this production step.',
      ];
      const body = [activationContent, movementContent, combatContent, invasionContent, productionContent][selected](state);
      return `<section class="task-panel" id="step-panel" role="tabpanel" aria-labelledby="step-tab-${selected}" tabindex="0"><div class="task-content"><div class="viewing-line"><span class="eyebrow">Viewing: Step ${selected + 1} / 5 · ${stepNames[selected]}</span><span>${type}</span></div><div class="task-title-row"><h2>${editing ? 'Edit ' + (selected === 3 ? 'landings' : stepNames[selected].toLowerCase()) : stepNames[selected]}</h2>${editButton(state, selected)}</div><p class="task-description">${descriptions[selected]}</p>${body}</div>${taskFooter(state)}</section>`;
    }
    function render() {
      const state = currentState();
      const timelineScroll = document.querySelector('.timeline-scroll')?.scrollLeft ?? 0;
      const label = { draft: 'Private draft', live: 'Live action', summary: 'Action summary' }[mode];
      document.documentElement.style.setProperty('--accent', mode === 'draft' ? 'var(--gold)' : mode === 'live' ? 'var(--cyan)' : 'var(--green)');
      document.getElementById('example').value = state.example;
      document.getElementById('app').innerHTML = `<div class="game-bar"><div class="game-status"><div class="eyebrow">Round 3 · Action phase</div><strong><i class="status-dot"></i>${mode === 'draft' ? 'Your turn · Preparing a tactical action' : mode === 'live' && state.frontier !== null ? 'Your tactical action is underway' : 'Jamie’s tactical action · Complete'}</strong></div><nav class="workspace-switch" aria-label="Action workspace">${['draft', 'live', 'summary'].map((workspace) => `<button data-action="workspace" data-mode="${workspace}" aria-pressed="${mode === workspace}">${workspace === 'summary' ? 'Summary' : workspace[0].toUpperCase() + workspace.slice(1)}</button>`).join('')}</nav><div class="identity"><span class="seat-marker">▲</span><div><strong>Jamie <span>· You</span></strong><span>Federation of Sol</span></div></div></div>
          <article class="action-frame"><header class="action-heading"><div><div class="action-title"><h1>Tactical action</h1><span class="badge badge--${mode}">${label}</span></div><p>System ${state.data.activation.system} · ${systemName(state)} <span style="color: var(--faint)">/ Jamie · Sol</span></p></div><div class="action-heading-controls">${mode === 'draft' ? `<span class="apply-hint">${applyReadiness(state)}</span><button class="button button--primary" data-action="open-apply" title="${applyReadiness(state)}" ${!canApply(state) ? 'disabled' : ''}>Apply to Live ${icon('arrow')}</button>` : `<span class="badge badge--${mode}">${state.frontier === null ? 'Complete' : 'In progress'}</span>`}</div></header>${renderTimeline(state)}${renderPosition(state)}<div class="action-body">${renderMap(state)}${renderTask(state)}</div></article>
          <div class="scenario-note"><span><strong>Try it:</strong> ${state.tip}</span><span class="offline">${icon('offline')}Standalone · Fictional data · Scripted outcomes</span></div>`;
      const scroller = document.querySelector('.timeline-scroll');
      scroller.scrollLeft = timelineScroll;
      const selectedTab = document.getElementById(`step-tab-${state.selected}`);
      const tabBox = selectedTab.getBoundingClientRect();
      const scrollBox = scroller.getBoundingClientRect();
      if (tabBox.right > scrollBox.right) scroller.scrollLeft += tabBox.right - scrollBox.right + 12;
      else if (tabBox.left < scrollBox.left) scroller.scrollLeft -= scrollBox.left - tabBox.left + 12;
      document.querySelectorAll('.round-details').forEach((details) => details.addEventListener('toggle', () => {
        const number = Number(details.dataset.round);
        if (details.open && !state.roundsOpen.includes(number)) state.roundsOpen.push(number);
        if (!details.open) state.roundsOpen = state.roundsOpen.filter((round) => round !== number);
      }));
    }
    function announce(message) { document.getElementById('announcer').textContent = message; }
    function toast(message) {
      const element = document.getElementById('toast');
      element.textContent = message;
      element.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove('visible'), 3500);
    }
    function selectStep(step, keyboard = false) {
      const state = currentState();
      if (!isReached(state, step)) return;
      state.selected = step;
      render();
      const button = document.getElementById(`step-tab-${step}`);
      button.focus({ preventScroll: true });
      if (keyboard) button.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      announce(`Viewing ${stepNames[step]}. ${state.frontier === null ? 'Action complete.' : `Current step: ${stepNames[state.frontier]}.`}`);
    }
    function afterMovement(state) {
      state.stale = false;
      state.skipped = {};
      if (state.data.activation.system === '19') {
        state.skipped = { 2: 'No opposing ships', 3: 'No ground forces committed', 4: 'No production source' };
        state.frontier = null;
        state.blocker = null;
        state.completed = true;
        state.selected = 1;
        return;
      }
      if (state.route === 'hostile') {
        state.frontier = 2; state.blocker = 'boundary'; state.selected = 2;
      } else if (state.route === 'cannon') {
        state.frontier = 1; state.blocker = 'boundary'; state.selected = 1;
      } else {
        state.skipped[2] = 'No opposing ships';
        const committed = state.data.invasion.starpoint + state.data.invasion.newalbion;
        if (committed > infantryAvailable(state)) {
          state.frontier = 3; state.blocker = 'needs-review'; state.selected = 3;
        } else if (state.route === 'friendly') {
          state.frontier = 4; state.blocker = 'decision'; state.selected = 4;
        } else {
          state.frontier = 3; state.blocker = 'decision'; state.selected = 3;
        }
      }
    }
    function commitEdit() {
      const state = currentState();
      if (!state.edit || validation(state)) return;
      const step = state.edit.step;
      const key = ['activation', 'movement', '', 'invasion', 'production'][step];
      state.data[key] = clone(state.edit.value);
      state.edit = null;
      state.revision = revision++;
      state.completed = false;
      if (step === 0) {
        if (state.data.activation.system === '19') state.route = 'empty';
        else state.route = 'hostile';
        state.skipped = {}; state.frontier = 1; state.blocker = 'decision'; state.selected = 1; state.inspect = state.data.activation.system;
      } else if (step === 1) {
        afterMovement(state);
      } else if (step === 3) {
        if (mode === 'live' && state.route !== 'friendly' && state.data.invasion.newalbion > 0) {
          state.frontier = 3; state.phase = 'ground'; state.blocker = 'waiting'; state.selected = 3;
        } else if (state.route === 'ground' && state.data.invasion.newalbion > 0) {
          state.frontier = 3; state.blocker = 'boundary'; state.selected = 3;
        } else {
          state.frontier = 4; state.blocker = 'decision'; state.selected = 4;
        }
      } else if (step === 4) {
        state.frontier = null; state.blocker = null; state.completed = true; state.selected = 4;
      }
      render();
      document.getElementById('step-panel').focus({ preventScroll: true });
      toast(mode === 'draft' ? `${stepNames[step]} committed to the private draft. Later steps revalidated.` : `${stepNames[step]} resolved in the local demo.`);
      announce(position(state).title);
    }
    function openApply() {
      const state = currentState();
      if (mode !== 'draft' || !canApply(state)) return;
      const movement = state.data.movement;
      const totals = movementTotals(movement);
      const dialog = document.getElementById('apply-dialog');
      dialog.innerHTML = `<div class="dialog-content"><span class="badge badge--draft">Local demonstration</span><h2 id="apply-title">Apply the recorded choices?</h2><p id="apply-description">This switches to the mock Live workspace. All changes happen only in this HTML page.</p><ul><li>Activate ${systemName(state)} · #${state.data.activation.system}</li><li>Move ${totals.ships} ships from Jord</li><li>Transport ${movement.infantry} infantry and ${movement.fighter} fighters</li>${!state.skipped[3] && (state.frontier === null || state.frontier >= 3) ? `<li>Land ${state.data.invasion.starpoint + state.data.invasion.newalbion} infantry across the two planets</li>` : ''}${state.frontier === null && !state.skipped[4] ? `<li>Produce ${productionTotals(state.data.production).count} units</li>` : ''}</ul><div class="inline-note"><strong>1 tactic token.</strong> ${state.frontier === null ? 'The complete recorded action is prepared.' : 'Only the recorded prefix is applied. Combat and later decisions continue in Live.'}</div></div><div class="dialog-footer"><button class="button button--quiet" data-action="close-apply" autofocus>Cancel</button><button class="button button--primary" data-action="confirm-apply">Apply in demo ${icon('arrow')}</button></div>`;
      dialog.showModal();
    }
    function confirmApply() {
      const draft = workspaces.draft;
      const live = clone(draft);
      live.mode = 'live'; live.edit = null; live.roundsOpen = []; live.stale = false;
      live.example = 'live-invasion'; live.tip = 'This is the applied draft in the local Live workspace. Earlier choices are now read-only; resolve each scripted decision to continue.';
      if (live.frontier === 2 || live.route === 'cannon') {
        live.frontier = 2; live.blocker = 'decision'; live.selected = 2;
      } else if (live.frontier === 3) {
        live.phase = 'ground'; live.blocker = 'waiting'; live.selected = 3;
      } else if (live.frontier !== null) {
        live.blocker = 'decision'; live.selected = live.frontier;
      }
      workspaces.live = live;
      document.getElementById('apply-dialog').close();
      mode = 'live';
      render();
      document.getElementById('step-panel').focus({ preventScroll: true });
      toast('Recorded choices applied to the local Live example.');
    }
    function advanceLive() {
      const state = currentState();
      if (mode !== 'live') return;
      if (state.frontier === 2) {
        state.frontier = 3; state.phase = 'landings'; state.blocker = 'decision'; beginEdit(state, 3);
      } else if (state.frontier === 3 && state.phase === 'ground') {
        state.frontier = 4; state.blocker = 'decision'; state.phase = 'production'; beginEdit(state, 4);
      }
      render();
      document.getElementById('step-panel').focus({ preventScroll: true });
      toast(state.frontier === 3 ? 'Space combat resolved. Its result is available in the Space combat tab.' : 'New Albion captured. Ground-combat results are retained in Invasion.');
    }
    function restoreFocus(key) {
      const target = document.querySelector(`[data-focus-key="${key}"]`);
      if (target && !target.disabled) target.focus({ preventScroll: true });
      else document.getElementById('step-panel').focus({ preventScroll: true });
    }
    document.addEventListener('click', (event) => {
      const control = event.target.closest('[data-action]');
      if (!control || control.disabled) return;
      const state = currentState();
      const action = control.dataset.action;
      if (action === 'select-step') return selectStep(Number(control.dataset.step));
      if (action === 'workspace') {
        mode = control.dataset.mode; render();
        document.querySelector(`[data-action="workspace"][data-mode="${mode}"]`).focus({ preventScroll: true });
        return;
      }
      if (action === 'return-current') return selectStep(state.frontier);
      if (action === 'return-edit') return selectStep(state.edit.step);
      if (action === 'edit-step') {
        const step = Number(control.dataset.step);
        if (state.edit || !isReached(state, step) || step === 2 || mode === 'summary' || mode === 'live' && step !== state.frontier) return;
        beginEdit(state, step); render();
        document.getElementById('step-panel').focus({ preventScroll: true });
        announce(`Editing ${stepNames[step]}. Changes are uncommitted.`);
        return;
      }
      if (action === 'cancel-edit') {
        state.edit = null; render();
        document.getElementById('step-panel').focus({ preventScroll: true });
        toast('Edits cancelled. The recorded choices are preserved.');
        return;
      }
      if (action === 'count') {
        if (state.edit?.step !== Number(control.dataset.step)) return;
        const key = control.dataset.key;
        const delta = Number(control.dataset.delta);
        state.edit.value[key] = Math.max(0, Math.min(delta > 0 ? Number(control.dataset.max) : Infinity, state.edit.value[key] + delta));
        state.edit.dirty = true;
        const focusKey = control.dataset.focusKey;
        render(); restoreFocus(focusKey);
        announce(validation(state) || `${unitNames[key] || key}: ${state.edit.value[key]} staged.`);
        return;
      }
      if (action === 'commit-edit') return commitEdit();
      if (action === 'open-apply') return openApply();
      if (action === 'close-apply') return document.getElementById('apply-dialog').close();
      if (action === 'confirm-apply') return confirmApply();
      if (action === 'advance-live') return advanceLive();
      if (action === 'open-summary') {
        workspaces.summary = clone(state); workspaces.summary.mode = 'summary'; workspaces.summary.example = 'summary'; workspaces.summary.tip = examples.summary.tip;
        mode = 'summary'; render(); return;
      }
      if (action === 'choose-system') {
        if (state.edit?.step !== 0) return;
        state.edit.value.system = control.dataset.system; state.edit.dirty = true; state.inspect = control.dataset.system; render(); return;
      }
      if (action === 'inspect-system') {
        state.inspect = control.dataset.system;
        if (state.edit?.step === 0 && ['27', '19'].includes(control.dataset.system)) {
          state.edit.value.system = control.dataset.system; state.edit.dirty = true;
        }
        render();
        document.querySelector(`[data-action="inspect-system"][data-system="${state.inspect}"]`)?.focus({ preventScroll: true });
        return;
      }
      if (action === 'zoom' || action === 'center-map') {
        state.zoom = action === 'center-map' ? 1 : Math.max(.7, Math.min(1.3, state.zoom + Number(control.dataset.delta)));
        render();
        document.querySelector(`[data-action="${action}"]${control.dataset.delta ? `[data-delta="${control.dataset.delta}"]` : ''}`)?.focus({ preventScroll: true });
      }
    });
    document.addEventListener('change', (event) => {
      if (event.target.dataset.action !== 'payment') return;
      const state = currentState();
      if (state.edit?.step !== 4) return;
      state.edit.value[event.target.dataset.key] = event.target.checked;
      state.edit.dirty = true;
      const key = event.target.dataset.focusKey;
      render(); restoreFocus(key);
      announce(validation(state) || 'Production payment staged.');
    });
    document.addEventListener('keydown', (event) => {
      const tab = event.target.closest('[role="tab"]');
      if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
        event.preventDefault();
        const state = currentState();
        const last = state.frontier ?? 4;
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? last : (state.selected + (event.key === 'ArrowRight' ? 1 : -1) + last + 1) % (last + 1);
        selectStep(next, true);
      }
      const mapSystem = event.target.closest('.system[role="button"]');
      if (mapSystem && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); mapSystem.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    });
    document.getElementById('example').addEventListener('change', (event) => {
      const state = makeState(event.target.value);
      clearTimeout(toastTimer);
      document.getElementById('toast').classList.remove('visible');
      mode = state.mode;
      workspaces[mode] = state;
      render();
      document.getElementById('example').focus({ preventScroll: true });
      announce(`Loaded ${event.target.selectedOptions[0].textContent}.`);
    });
    document.getElementById('reset-example').addEventListener('click', () => {
      const example = currentState().example;
      workspaces[mode] = makeState(example);
      render();
      document.getElementById('reset-example').focus({ preventScroll: true });
      toast('This example has been reset.');
    });
    render();
  </script>
</body>

</html>
